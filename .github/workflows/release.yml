# Cross-platform builds on GitHub's hosted runners.
#
# The Windows installer (Descry-Setup-X.Y.Z.exe) is still built locally with
# Forge and published by the local RELEASE flow. This workflow adds, from
# the same tag:
#   - macOS:   Descry-X.Y.Z.dmg + Descry-X.Y.Z-macos-arm64.zip (package_macos.sh)
#   - Linux:   Descry-X.Y.Z-x86_64.AppImage (linuxdeploy)
#   - Windows: Descry-X.Y.Z-windows-x64-portable.zip (MSYS2, no installer)
#
# Pushing a v* tag builds all three and attaches them to that tag's release
# once it exists (the local flow creates it right after pushing the tag).
# A manual run builds from any ref and only keeps the files as workflow
# artifacts, unless `release_tag` names a release to attach them to.

name: release-builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        default: "main"
      release_tag:
        description: "Attach to this existing release (empty = artifacts only)"
        default: ""

# Read-only by default; only the publish job, which runs none of the build
# tooling, gets to write to the release.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15            # Apple Silicon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Dependencies
        run: brew install ninja pkg-config sdl2 freetype harfbuzz libpng jpeg dylibbundler
      - name: Build + package
        run: ./package_macos.sh --dmg --zip
      - name: Self-contained check
        # Launch the packaged app the way a Mac without Homebrew would see it:
        # hide every Homebrew library, then make sure it starts and that all
        # the libraries it loads come from the bundle or from macOS.
        run: |
          app=dist/macos-arm64/Descry.app
          cellar="$(brew --cellar)"
          mv "$cellar" "$cellar.hidden"
          trap 'mv "$cellar.hidden" "$cellar"' EXIT
          DYLD_PRINT_LIBRARIES=1 "$app/Contents/MacOS/descry" > smoke.log 2>&1 &
          pid=$!
          sleep 12
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; kill "$pid" || true; fi
          grep -v '/usr/lib/\|/System/' smoke.log | tail -n 60 || true
          fail=0
          if grep -E 'Library not loaded|image not found|/opt/homebrew/|/usr/local/' smoke.log; then
            echo "::error::the app reached outside its bundle"; fail=1
          fi
          grep -q 'Contents/Frameworks/libSDL2' smoke.log || { echo "::error::bundled SDL2 was not loaded"; fail=1; }
          if grep -aq 'libSDL3' "$app"/Contents/Frameworks/libSDL2*.dylib; then
            grep -q 'Contents/Frameworks/libSDL3' smoke.log || { echo "::error::bundled SDL3 was not loaded"; fail=1; }
          fi
          if [ "$alive" -ne 1 ]; then
            if grep -q 'SDL_CreateRenderer\|SDL_CreateWindow' smoke.log; then
              echo "::warning::libraries loaded, but the runner could not open a window"
            else
              echo "::error::the app exited during startup"; fail=1
            fi
          fi
          exit "$fail"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            dist/Descry-*.dmg
            dist/Descry-*-macos-*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04        # older glibc = the AppImage runs on more distros
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libfreetype-dev libharfbuzz-dev libpng-dev libjpeg-dev \
            libfuse2 file
      - name: Build
        run: ./build.sh
      - name: AppImage
        run: |
          version="$(sed -n 's/.*#define DESCRY_VERSION "\([0-9.]*\)".*/\1/p' src/version.h)"
          app=AppDir
          mkdir -p "$app/usr/bin/plugins"
          cp build/descry "$app/usr/bin/"
          # The app pins its cwd to the exe dir and loads plugins/ from there.
          cp data/plugins/*.lua "$app/usr/bin/plugins/"
          cp resources/icon_256.png descry.png
          cat > descry.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Descry
          Comment=Markdown notes
          Exec=descry %F
          Icon=descry
          Categories=Office;TextEditor;
          MimeType=text/markdown;
          Terminal=false
          EOF
          # A fixed release, checked against its published SHA-256: never the
          # moving "continuous" build, which is whatever was pushed last.
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          export APPIMAGE_EXTRACT_AND_RUN=1
          # sdl2-compat's libSDL2 dlopen()s libSDL3, which linuxdeploy cannot
          # see. Ubuntu 22.04 ships the real SDL2, but if that ever changes,
          # carry SDL3 along explicitly.
          extra=()
          sdl2="$(ldd build/descry | awk '/libSDL2/ {print $3}')"
          if [ -n "$sdl2" ] && grep -aq 'libSDL3' "$sdl2"; then
            extra=(--library "$(dirname "$sdl2")/libSDL3.so.0")
          fi
          ./linuxdeploy --appdir "$app" "${extra[@]}" -d descry.desktop -i descry.png --output appimage
          mkdir -p dist
          mv Descry*.AppImage "dist/Descry-${version}-x86_64.AppImage"
      - name: Self-contained check
        # Run the AppImage on a different, bare distro that has only what the
        # AppImage convention expects of any Linux desktop (X11, OpenGL, ALSA,
        # font libraries) and none of Descry's own dependencies.
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12-slim bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              xvfb xauth libgl1 libgl1-mesa-dri libegl1 libasound2 \
              libharfbuzz0b libfreetype6 libfontconfig1 >/dev/null
            cd /tmp
            cp /dist/Descry-*.AppImage app.AppImage && chmod +x app.AppImage
            ./app.AppImage --appimage-extract >/dev/null
            missing="$(LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/descry | grep "not found" || true)"
            if [ -n "$missing" ]; then echo "$missing"; echo "::error::libraries missing from the AppImage"; exit 1; fi
            rc=0
            xvfb-run -a timeout -k 5 12 squashfs-root/AppRun > smoke.log 2>&1 || rc=$?
            cat smoke.log
            if [ "$rc" -ne 124 ]; then echo "::error::the app exited during startup (exit $rc)"; exit 1; fi
            echo "AppImage started and stayed up on a bare Debian 12."
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/Descry-*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
      - name: Build
        # CMakeLists bundles the MinGW runtime DLLs next to descry.exe.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Portable zip
        run: |
          version="$(sed -n 's/.*#define DESCRY_VERSION "\([0-9.]*\)".*/\1/p' src/version.h)"
          stage="Descry-${version}-windows-x64"
          mkdir -p "$stage/plugins" dist
          cp build/descry.exe build/*.dll "$stage/"
          cp data/plugins/*.lua "$stage/plugins/"
          cp LICENSE.txt "$stage/"
          zip -qr "dist/${stage}-portable.zip" "$stage"
      - name: Self-contained check
        # Every imported DLL must be in the folder or part of Windows, and
        # the app must start with nothing but Windows itself on PATH.
        run: |
          version="$(sed -n 's/.*#define DESCRY_VERSION "\([0-9.]*\)".*/\1/p' src/version.h)"
          stage="Descry-${version}-windows-x64"
          bash tools/verify_bundle_windows.sh "$stage"
          cd "$stage"
          PATH="/c/Windows/System32:/c/Windows" ./descry.exe > ../smoke.log 2>&1 &
          pid=$!
          sleep 12
          cat ../smoke.log || true
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "descry.exe started and stayed up without MSYS2 on PATH."
          elif grep -q 'SDL_CreateRenderer\|SDL_CreateWindow' ../smoke.log; then
            echo "::warning::libraries loaded, but the runner could not open a window"
          else
            echo "::error::descry.exe exited during startup"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/Descry-*-portable.zip
          if-no-files-found: error

  publish:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Wait for the release, then attach
        run: |
          # The local RELEASE flow creates the release (with the Forge
          # installer) right after pushing the tag; don't race it.
          for i in $(seq 1 60); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "waiting for release $TAG ($i/60) ..."; sleep 30
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          ls -la out
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          # Checksums for every asset, the locally built installer included,
          # so a download can be verified: sha256sum -c SHA256SUMS.txt
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Descry-Setup-*.exe' -D out || true
          (cd out && sha256sum Descry-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" out/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
